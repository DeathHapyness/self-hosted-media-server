services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped

    ports:
      # Porta do host : Porta do container
      - "5557:5001"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:-/opt/media-server}/dockge/data:/app/data

      # Para usar registries privados, compartilhe o arquivo de autenticação com o Dockge:
      # - /root/.docker/:/root/.docker

      # Pasta das stacks
      # ⚠️ O caminho precisa ser ABSOLUTO e IGUAL dos dois lados (host === container),
      # senão o Dockge grava os arquivos no caminho errado.
      - ${DATA_DIR:-/opt/media-server}/dockge/stacks:${DATA_DIR:-/opt/media-server}/dockge/stacks

    environment:
      # Diz ao Dockge onde fica a pasta das stacks (mesmo caminho do volume acima)
      - DOCKGE_STACKS_DIR=${DATA_DIR:-/opt/media-server}/dockge/stacks
