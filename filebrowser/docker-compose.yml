services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped

    ports:
      - "8082:80"

    volumes:
      - ${MEDIA_DIR:-/mnt/media}:/srv
      - ${DATA_DIR:-/opt/media-server}/filebrowser/database:/database
      - ${DATA_DIR:-/opt/media-server}/filebrowser/config:/config


    labels:
      - homepage.group=Administração
      - homepage.name=File Browser
      - homepage.icon=filebrowser.png
      - homepage.href= IP DO SEU FILEBROWSER AQUI
      - homepage.description=Gerenciador de arquivos
