services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped

    ports:
      - "8082:80"

    volumes:
      - /mnt/media:/srv
      - ./database:/database
      - ./config:/config


    labels:
      - homepage.group=Administração
      - homepage.name=File Browser
      - homepage.icon=filebrowser.png
      - homepage.href= IP DO SEU FILEBROWSER AQUI
      - homepage.description=Gerenciador de arquivos
