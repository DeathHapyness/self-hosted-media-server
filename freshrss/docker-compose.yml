services:
  freshrss:
    image: docker.io/freshrss/freshrss:latest
    container_name: freshrss
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      TZ: America/Sao_Paulo
      CRON_MIN: "3,33"
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
      - freshrss_extensions:/var/www/FreshRSS/extensions

volumes:
  freshrss_data:
  freshrss_extensions: