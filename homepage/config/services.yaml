        icon: uptime-kuma.png
        href: "http://{{HOMEPAGE_VAR_INTERNAL_IP}}:3020"
        server: local
        container: uptime-kuma
        description: Disponibilidade dos serviços
        widget:
          type: uptimekuma
          url: "http://{{HOMEPAGE_VAR_INTERNAL_IP}}:3020"
          slug: serviso-homepage
