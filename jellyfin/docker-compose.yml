services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped

    ports:
      - "8096:8096"

    volumes:
      - ${DATA_DIR:-/opt/media-server}/jellyfin/config:/config
      - ${DATA_DIR:-/opt/media-server}/jellyfin/cache:/cache
      - ${MEDIA_DIR:-/mnt/media}:/media

    environment:
      - TZ=America/Sao_Paulo

