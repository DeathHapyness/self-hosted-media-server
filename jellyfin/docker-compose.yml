services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped

    ports:
      - "8096:8096"

    volumes:
      - ./config:/config
      - ./cache:/cache
      - /mnt/media:/media

    environment:
      - TZ=America/Sao_Paulo

    labels:
      - homepage.group=Mídia
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin.png
      - homepage.href= IP DO SEU FELLYFIN AQUI
      - homepage.description=Servidor de filmes e séries
