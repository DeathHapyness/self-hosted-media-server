services:
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ${DATA_DIR:-/opt/media-server}/jellyseerr/config:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

networks:
  default:
    name: media_network
    external: true
