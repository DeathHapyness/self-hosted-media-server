services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    labels:
      - homepage.group=Monitoramento
      - homepage.name=Prometheus
      - homepage.icon=prometheus.png
      - homepage.href=IP PROMETHEUS
      - homepage.description=Coletor de métricas

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    restart: unless-stopped
    labels:
      - homepage.group=Monitoramento
      - homepage.name=Node Exporter
      - homepage.icon=prometheus.png
      - homepage.href=IP PROMETHEUS
      - homepage.description=Métricas do host

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8085:8080"
    restart: unless-stopped
    labels:
      - homepage.group=Monitoramento
      - homepage.name=cAdvisor
      - homepage.icon=cadvisor.png
      - homepage.href=IP CADAVISOR
      - homepage.description=Métricas por container

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    labels:
      - homepage.group=Monitoramento
      - homepage.name=Grafana
      - homepage.icon=grafana.png
      - homepage.href= IP DO HOMEPAGE
      - homepage.description=Dashboards e visualização

networks:
  default:
    name: media_network
    external: true