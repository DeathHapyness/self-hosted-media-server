services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped

    ports:
      - "4533:4533"

    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      TZ: America/Sao_Paulo

    volumes:
      - ${DATA_DIR:-/opt/media-server}/navidrome/data:/data
      - ${MEDIA_DIR:-/mnt/media}/musicas:/music:ro  
