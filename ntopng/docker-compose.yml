services:
  redis:
    image: redis:7-alpine
    container_name: ntopng-redis
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/opt/media-server}/ntopng/redis-data:/data
    command: redis-server --appendonly yes

  ntopng:
    image: ntop/ntopng:latest
    container_name: ntopng
    restart: unless-stopped
    depends_on:
      - redis
    command: >
      --redis=redis:6379
      --http-port=3000
    ports:
      - "3100:3000"
    volumes:
      - ${DATA_DIR:-/opt/media-server}/ntopng/ntopng-data:/var/lib/ntopng

