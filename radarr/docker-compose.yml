services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo

    volumes:
      - ${MEDIA_DIR:-/mnt/media}:/media
      - ${DATA_DIR:-/opt/media-server}/radarr/config:/config

    ports:
      - "7878:7878"

