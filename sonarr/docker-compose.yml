services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ${DATA_DIR:-/opt/media-server}/sonarr/config:/config
      - /caminho/para/tv:/tv
      - /caminho/para/downloads:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped
