services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config:/config
      - /caminho/para/tv:/tv
      - /caminho/para/downloads:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped

    labels:
      - homepage.group=Media
      - homepage.name=Sonarr
      - homepage.icon=sonarr.png
      - homepage.href=IP SONARR
      - homepage.description=Gerenciador de séries